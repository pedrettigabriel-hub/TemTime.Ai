        "guarulhos":        { lat: -23.4538, lon: -46.5333, nome: "Guarulhos, SP" },
        "santos":           { lat: -23.9618, lon: -46.3322, nome: "Santos, SP" },
        "santo andre":      { lat: -23.6639, lon: -46.5383, nome: "Santo André, SP" },
        "osasco":           { lat: -23.5325, lon: -46.7917, nome: "Osasco, SP" },
        "londrina":         { lat: -23.3045, lon: -51.1696, nome: "Londrina, PR" },
        "maringa":          { lat: -23.4205, lon: -51.9331, nome: "Maringá, PR" },
        "joinville":        { lat: -26.3044, lon: -48.8487, nome: "Joinville, SC" },
        "caxias do sul":    { lat: -29.1685, lon: -51.1796, nome: "Caxias do Sul, RS" },
        "uberlandia":       { lat: -18.9186, lon: -48.2772, nome: "Uberlândia, MG" },
        "juiz de fora":     { lat: -21.7642, lon: -43.3503, nome: "Juiz de Fora, MG" },
        "contagem":         { lat: -19.9317, lon: -44.0536, nome: "Contagem, MG" },
        "feira de santana": { lat: -12.2664, lon: -38.9663, nome: "Feira de Santana, BA" }
    };

    function normalizar(s) {
        return String(s || "")
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .toLowerCase().trim();
    }

    function buscarLocal(query) {
        const q = normalizar(query);
        if (q.length < 2) return [];
        const out = [];
        if (CIDADES_BR[q]) {
            out.push({
                label: CIDADES_BR[q].nome,
                lat: CIDADES_BR[q].lat,
                lon: CIDADES_BR[q].lon,
                fonte: "local"
            });
        }
        for (const k in CIDADES_BR) {
            if (k === q) continue;
            if (k.indexOf(q) !== -1) {
                out.push({
                    label: CIDADES_BR[k].nome,
                    lat: CIDADES_BR[k].lat,
                    lon: CIDADES_BR[k].lon,
                    fonte: "local"
                });
            }
            if (out.length >= 8) break;
        }
        return out;
    }

    const nominatimCache = {};
    function buscarNominatim(query) {
        const q = query.trim();
        if (nominatimCache[q]) return Promise.resolve(nominatimCache[q]);
        const url = "https://nominatim.openstreetmap.org/search" +
                    "?format=jsonv2&limit=8&addressdetails=1" +
                    "&countrycodes=br&accept-language=pt-BR" +
                    "&q=" + encodeURIComponent(q);
        return fetch(url, { headers: { "Accept": "application/json" } })
            .then(function (r) {
                if (!r.ok) throw new Error("Nominatim HTTP " + r.status);
                return r.json();
            })
            .then(function (arr) {
                const out = (arr || []).map(function (it) {
                    return {
                        label: it.display_name || it.name || "",
                        lat: parseFloat(it.lat),
                        lon: parseFloat(it.lon),
                        fonte: "nominatim"
                    };
                }).filter(function (x) {
                    return x.label && isFinite(x.lat) && isFinite(x.lon);
                });
                nominatimCache[q] = out;
                return out;
            });
    }

    log("bootstrap — app:", "Tem Flag Football.ai?",
        "| times:", TIMES.length,
        "| google:", USE_GOOGLE && !!GOOGLE_KEY);

    function waitForMap(cb, tries) {
        tries = tries || 100;
        if (typeof window[MAP_VAR] !== "undefined") {
            return cb(window[MAP_VAR]);
        }
        if (tries <= 0) {
            error("variável do mapa não encontrada:", MAP_VAR);
            return;
        }
        setTimeout(function () { waitForMap(cb, tries - 1); }, 100);
    }

    function init(map) {
        log("init OK — painel será montado");

        const painel    = document.getElementById("busca-painel");
        const corpo     = document.getElementById("busca-corpo");
        const btnGeo    = document.getElementById("btn-geo");
        const raioInput = document.getElementById("raio");
        const raioValor = document.getElementById("raio-valor");
        const textoInp  = document.getElementById("busca-texto");
        const sugestoes = document.getElementById("busca-sugestoes");
        const status    = document.getElementById("busca-status");
        const listaUl   = document.getElementById("busca-resultados");
        const toggleBtn = document.getElementById("busca-toggle");

        if (!painel || !textoInp) {
            error("elementos do painel não encontrados no DOM");
            return;
        }

        const resultadosLayer = L.layerGroup().addTo(map);
        const userLayer       = L.layerGroup().addTo(map);
        let userPos      = null;
        let googleActive = false;

        const resultIcon = L.divIcon({
            className: "",
            html: '<div style="width:16px;height:16px;background:#dc2626;' +
                  'border:2px solid white;border-radius:50%;' +
                  'box-shadow:0 2px 6px rgba(0,0,0,0.45);"></div>',
            iconSize: [16, 16], iconAnchor: [8, 8]
        });
        const userIcon = L.divIcon({
            className: "",
            html: '<div style="width:20px;height:20px;background:#0b5d3b;' +
                  'border:3px solid white;border-radius:50%;' +
                  'box-shadow:0 0 0 4px rgba(11,93,59,0.25);"></div>',
            iconSize: [20, 20], iconAnchor: [10, 10]
        });

        function haversine(lat1, lon1, lat2, lon2) {
            const R = 6371, toRad = function (x) { return x * Math.PI / 180; };
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return 2 * R * Math.asin(Math.sqrt(a));
        }

        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
            });
        }

        function limpar() {
            resultadosLayer.clearLayers();
            userLayer.clearLayers();
            listaUl.innerHTML = "";
            status.textContent = "";
        }

        function desenharUsuario(lat, lon, raioKm) {
            userLayer.clearLayers();
            L.marker([lat, lon], {icon: userIcon, zIndexOffset: 2000})
                .bindPopup("<b>📍 Origem da busca</b>").addTo(userLayer);
            if (raioKm && raioKm > 0) {
                L.circle([lat, lon], {
                    radius: raioKm * 1000, color: "#0b5d3b", weight: 1.5,
                    fillColor: "#0b5d3b", fillOpacity: 0.06, dashArray: "6 4"
                }).addTo(userLayer);
            }
        }

        function render(lista, latUser, lonUser, raioKm) {
            resultadosLayer.clearLayers();
            listaUl.innerHTML = "";
            if (latUser !== null && latUser !== undefined) {
                desenharUsuario(latUser, lonUser, raioKm);
            }

            if (lista.length === 0) {
                status.textContent = (latUser !== null && latUser !== undefined)
                    ? "Nenhum time num raio de " + raioKm + " km."
                    : "Nenhum resultado encontrado.";
                return;
            }

            status.textContent = lista.length + " time(s) encontrado(s).";

            const bounds = L.latLngBounds([]);
            if (latUser !== null && latUser !== undefined) {
                bounds.extend([latUser, lonUser]);
            }

            lista.forEach(function (t, i) {
                const cm = L.marker([t.lat, t.lon], {
                    icon: resultIcon, zIndexOffset: 1000
                }).bindPopup(
                    '<div style="font-family:system-ui,Arial;font-size:13px">' +
                    "<b>" + esc(t.nome) + "</b><br>" +
                    esc(t.municipio) + "/" + esc(t.uf) +
                    (t.distancia !== undefined
                        ? '<br><span style="color:#dc2626;font-weight:600">' +
                          t.distancia.toFixed(1) + " km</span>"
                        : "") +
                    "</div>"
                );
                cm.addTo(resultadosLayer);
                bounds.extend([t.lat, t.lon]);

                if (i < 25) {
                    const li = document.createElement("li");
                    li.innerHTML = "<b>" + esc(t.nome) + "</b><br>" +
                        (t.distancia !== undefined
                            ? '<span class="dist">' + t.distancia.toFixed(1) +
                              " km</span> · "
                            : "") +
                        '<span class="cidade">' + esc(t.municipio) + "/" +
                        esc(t.uf) + "</span>";
                    li.addEventListener("click", function () {
                        map.flyTo([t.lat, t.lon], 14);
                        cm.openPopup();
                    });
                    listaUl.appendChild(li);
                }
            });

            if (bounds.isValid()) {
                map.fitBounds(bounds, {padding: [50, 50], maxZoom: 13});
            }
        }

        function buscarPerto(lat, lon) {
            const raio = parseFloat(raioInput.value) || 25;
            const lista = TIMES.map(function (t) {
                return Object.assign({}, t, {
                    distancia: haversine(lat, lon, t.lat, t.lon)
                });
            }).filter(function (t) {
                return t.distancia <= raio;
            }).sort(function (a, b) {
                return a.distancia - b.distancia;
            });
            log("buscarPerto", lat.toFixed(4), lon.toFixed(4),
                "raio", raio, "→", lista.length, "resultados");
            render(lista, lat, lon, raio);
        }

        ["click","dblclick","mousedown","wheel","touchstart"]
            .forEach(function (ev) {
                painel.addEventListener(ev, function (e) { e.stopPropagation(); });
            });

        toggleBtn.addEventListener("click", function () {
            const vis = corpo.style.display !== "none";
            corpo.style.display = vis ? "none" : "block";
            toggleBtn.textContent = vis ? "+" : "−";
        });

        if (window.innerWidth < 600) {
            corpo.style.display = "none";
            toggleBtn.textContent = "+";
        }

        raioInput.addEventListener("input", function () {
            raioValor.textContent = raioInput.value;
            if (userPos) buscarPerto(userPos.lat, userPos.lon);
        });

        btnGeo.addEventListener("click", function () {
            if (!navigator.geolocation) {
                status.textContent = "Geolocalização não disponível neste navegador.";
                return;
            }
            btnGeo.disabled = true;
            btnGeo.textContent = "⏳ Obtendo localização...";
            status.textContent = "";
            navigator.geolocation.getCurrentPosition(
                function (pos) {
                    btnGeo.disabled = false;
                    btnGeo.textContent = "📍 Usar minha localização";
                    userPos = {
                        lat: pos.coords.latitude,
                        lon: pos.coords.longitude
                    };
                    buscarPerto(userPos.lat, userPos.lon);
                },
                function (err) {
                    btnGeo.disabled = false;
                    btnGeo.textContent = "📍 Usar minha localização";
                    let msg = "Não foi possível obter sua localização.";
                    if (err.code === 1) msg = "Permissão negada.";
                    else if (err.code === 2) msg = "Localização indisponível.";
                    else if (err.code === 3) msg = "Tempo esgotado.";
                    status.textContent = msg;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
            );
        });

        function usarCoordenadas(lat, lon, label) {
            log("usarCoordenadas", lat, lon, "|", label);
            if (label) textoInp.value = label;
            sugestoes.classList.remove("visivel");
            userPos = { lat: lat, lon: lon };
            buscarPerto(lat, lon);
        }

        function renderSugestoes(itens) {
            sugestoes.innerHTML = "";
            if (!itens || itens.length === 0) {
                sugestoes.classList.remove("visivel");
                return;
            }
            itens.forEach(function (it) {
                const div = document.createElement("div");
                div.className = "item";
                div.innerHTML =
                    esc(it.label) +
                    ' <span class="fonte">' + esc(it.fonte || "") + "</span>";
                div.addEventListener("click", function () {
                    usarCoordenadas(it.lat, it.lon, it.label);
                });
                sugestoes.appendChild(div);
            });
            sugestoes.classList.add("visivel");
        }

        function setupGoogle() {
            if (!window.google || !google.maps || !google.maps.places) {
                warn("google.maps.places indisponível, seguindo com local + nominatim");
                return;
            }
            try {
                const ac = new google.maps.places.Autocomplete(textoInp, {
                    types: ["geocode"],
                    componentRestrictions: { country: "br" },
                    fields: ["geometry", "formatted_address", "name"]
                });
                ac.addListener("place_changed", function () {
                    const p = ac.getPlace();
                    if (!p.geometry || !p.geometry.location) return;
                    usarCoordenadas(
                        p.geometry.location.lat(),
                        p.geometry.location.lng(),
                        p.formatted_address || p.name || ""
                    );
                });
                googleActive = true;
                log("Google Places autocomplete ativo");
            } catch (e) {
                warn("erro ao criar Autocomplete:", e);
            }
        }

        if (USE_GOOGLE && GOOGLE_KEY) {
            window.initGoogleAutocomplete = setupGoogle;
            const s = document.createElement("script");
            s.src = "https://maps.googleapis.com/maps/api/js?key=" +
                    encodeURIComponent(GOOGLE_KEY) +
                    "&libraries=places&language=pt-BR&region=BR" +
                    "&callback=initGoogleAutocomplete";
            s.async = true; s.defer = true;
            s.onerror = function () { warn("falha ao carregar Google Maps JS"); };
            document.head.appendChild(s);
        }

        let timerBusca = null;
        let seqAtual = 0;

        textoInp.addEventListener("input", function () {
            if (googleActive) return;

            clearTimeout(timerBusca);
            const q = textoInp.value.trim();
            const seq = ++seqAtual;

            if (q.length < 2) {
                sugestoes.classList.remove("visivel");
                status.textContent = "";
                return;
            }

            const locais = buscarLocal(q);
            if (locais.length > 0) {
                renderSugestoes(locais);
                status.textContent = locais.length + " cidade(s) encontrada(s).";
            } else {
                status.textContent = "Buscando endereço...";
            }

            timerBusca = setTimeout(function () {
                buscarNominatim(q).then(function (remotas) {
                    if (seq !== seqAtual) return;
                    if (remotas.length === 0) {
                        if (locais.length === 0) {
                            status.textContent =
                                "Nenhum endereço encontrado para \"" + q + "\".";
                            sugestoes.classList.remove("visivel");
                        }
                        return;
                    }
                    const vistos = {};
                    locais.forEach(function (x) {
                        vistos[normalizar(x.label)] = true;
                    });
                    const merged = locais.slice();
                    remotas.forEach(function (x) {
                        const k = normalizar(x.label);
                        if (!vistos[k]) {
                            merged.push(x);
                            vistos[k] = true;
                        }
                    });
                    renderSugestoes(merged.slice(0, 10));
                    status.textContent = merged.length + " sugestão(ões).";
                }).catch(function (e) {
                    warn("Nominatim falhou:", e);
                    if (locais.length === 0) {
                        status.textContent =
                            "Busca de endereço indisponível no momento.";
                    }
                });
            }, 550);
        });

        document.addEventListener("click", function (e) {
            if (e.target !== textoInp && !sugestoes.contains(e.target)) {
                sugestoes.classList.remove("visivel");
            }
        });

        textoInp.addEventListener("keydown", function (e) {
            if (e.key === "Enter") e.preventDefault();
        });

        log("painel de busca pronto");
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
        waitForMap(init);
    } else {
        window.addEventListener("DOMContentLoaded", function () { waitForMap(init); });
    }
})();
</script>
